# Render Blueprint for the BACKEND (FastAPI). The Streamlit UI is deployed separately on Streamlit Community Cloud.
# See docs/DEPLOY.md for the steps and for what was and was not verified.
#
# Plan: NOT free. Measured locally (Windows): the API process tree is ~145 MB at start and ~629 MB after the embedding
# model loads, above the free plan's 512 MB. 'standard' (2 GB RAM as listed on Render's pricing page when this was written;
# check current pricing) leaves headroom, and persistent disks are only available on paid plans.
# Persistence: the disk below is mounted at /var/data. SQLite, ChromaDB (+ its source_register.json) and the Hugging Face model
# cache live there, so students, ingested documents and audit records survive restarts and deploys. A service with a disk
# runs a single instance, which also matches the single Uvicorn worker the source-register lock requires.
services:
  - type: web
    name: student-services-api
    runtime: python
    plan: standard
    region: oregon
    branch: deploy/render
    buildCommand: pip install --upgrade pip && pip install -r requirements-api.txt
    startCommand: python scripts/bootstrap_deploy.py && uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: STUDENT_DB_PATH
        value: /var/data/student_services.db
      - key: CHROMA_DIR
        value: /var/data/chroma
      - key: HF_HOME
        value: /var/data/huggingface
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: OPENAI_API_KEY      # optional, set in the dashboard (never in this file). Without it answers quote the cited text.
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: AUDIT_ADMIN_TOKEN   # generated by Render; lets an operator read any audit record via the X-Admin-Token header
        generateValue: true
